# ==============================================================================
# AdServe — Production Spring Boot Profile (application-prod.yml)
# Activated with: SPRING_PROFILES_ACTIVE=prod
# Designed for Railway deployment and cloud cloud-native services
# ==============================================================================

spring:
  application:
    name: adserve

  # ----------------------------------------------------------------------------
  # MySQL Database Configuration (Railway MySQL)
  # Supports standard DB_* variables or Railway native MYSQL* variables
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:adserve_db}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: AdServeProdHikariPool

  # ----------------------------------------------------------------------------
  # JPA / Hibernate Configuration
  # Production safety: ddl-auto=update (strictly avoids create-drop)
  # ----------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache Configuration (Railway Redis)
  # Supports host, port, and password authentication
  # ----------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:${REDISHOST:localhost}}
      port: ${REDIS_PORT:${REDISPORT:6379}}
      password: ${REDIS_PASSWORD:${REDISPASSWORD:}}
      timeout: 3000ms

  # ----------------------------------------------------------------------------
  # Apache Kafka Streaming Configuration (Railway Kafka / Cloud Broker)
  # ----------------------------------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${RAILWAY_KAFKA_HOST:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        acks: 1
        retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
    listener:
      auto-startup: ${KAFKA_AUTO_STARTUP:true}

  # ----------------------------------------------------------------------------
  # Jackson JSON Serialization
  # ----------------------------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ------------------------------------------------------------------------------
# HTTP Server & Port Configuration (Railway assigns PORT dynamically)
# ------------------------------------------------------------------------------
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  forward-headers-strategy: native

# ------------------------------------------------------------------------------
# Spring Boot Actuator Production Configuration
# ------------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: false

# ------------------------------------------------------------------------------
# AdServe Custom Application Properties
# ------------------------------------------------------------------------------
adserve:
  cache:
    ttl-seconds: ${ADSERVE_CACHE_TTL_SECONDS:300}
  kafka:
    topics:
      impressions: ${KAFKA_TOPIC_IMPRESSIONS:ad-impressions}
      clicks: ${KAFKA_TOPIC_CLICKS:ad-clicks}
      partitions: 3
      replicas: 1
    consumer:
      group:
        impression: ${KAFKA_GROUP_IMPRESSION:impression-analytics-group}
        click: ${KAFKA_GROUP_CLICK:click-analytics-group}

# ------------------------------------------------------------------------------
# Security & JWT Configuration
# ------------------------------------------------------------------------------
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# ------------------------------------------------------------------------------
# CORS Allowed Origins (Set to actual deployed Vercel domain)
# ------------------------------------------------------------------------------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost,http://localhost:3000}
