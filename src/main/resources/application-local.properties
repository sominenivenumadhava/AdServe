# ==============================================================================
# Local In-Memory Development Profile (H2 In-Memory Database)
# Run with: mvn spring-boot:run "-Dspring-boot.run.profiles=local"
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:adserve_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==============================================================================
# Redis & Cache Configuration
# Supports environment variables REDIS_HOST, REDIS_PORT, ADSERVE_CACHE_TTL_SECONDS
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
adserve.cache.ttl-seconds=${ADSERVE_CACHE_TTL_SECONDS:300}
management.health.redis.enabled=false

# ==============================================================================
# Apache Kafka Configuration (Local Profile)
# ==============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.listener.auto-startup=${KAFKA_AUTO_STARTUP:false}

adserve.kafka.topics.impressions=${KAFKA_TOPIC_IMPRESSIONS:ad-impressions}
adserve.kafka.topics.clicks=${KAFKA_TOPIC_CLICKS:ad-clicks}
adserve.kafka.topics.partitions=3
adserve.kafka.topics.replicas=1
adserve.kafka.consumer.group.impression=${KAFKA_GROUP_IMPRESSION:impression-analytics-group}
adserve.kafka.consumer.group.click=${KAFKA_GROUP_CLICK:click-analytics-group}

