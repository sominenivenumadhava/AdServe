# ==============================================================================
# Application Configuration
# ==============================================================================
spring.application.name=adserve
server.port=${PORT:8080}
# Default to 'local' (H2 in-memory) for zero-config startup; override with -Dspring.profiles.active=mysql or env vars
spring.profiles.default=local

# ==============================================================================
# MySQL Database Configuration
# Supports environment variables DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:adserve_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# Spring Boot Actuator Configuration
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ==============================================================================
# Jackson / JSON Formatting
# ==============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ==============================================================================
# Redis & Cache Configuration
# Supports environment variables REDIS_HOST, REDIS_PORT, ADSERVE_CACHE_TTL_SECONDS
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:${REDISPASSWORD:}}
spring.data.redis.timeout=2000ms
adserve.cache.ttl-seconds=${ADSERVE_CACHE_TTL_SECONDS:300}
management.health.redis.enabled=false

# ==============================================================================
# Apache Kafka Configuration
# Supports environment variables KAFKA_BOOTSTRAP_SERVERS, KAFKA_AUTO_STARTUP
# ==============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.listener.auto-startup=${KAFKA_AUTO_STARTUP:true}

adserve.kafka.topics.impressions=${KAFKA_TOPIC_IMPRESSIONS:ad-impressions}
adserve.kafka.topics.clicks=${KAFKA_TOPIC_CLICKS:ad-clicks}
adserve.kafka.topics.partitions=3
adserve.kafka.topics.replicas=1
adserve.kafka.consumer.group.impression=${KAFKA_GROUP_IMPRESSION:impression-analytics-group}
adserve.kafka.consumer.group.click=${KAFKA_GROUP_CLICK:click-analytics-group}

# ==============================================================================
# Security & JWT Configuration
# ==============================================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost,http://localhost:3000}


