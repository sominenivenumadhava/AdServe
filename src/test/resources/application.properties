spring.application.name=adserve-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
adserve.cache.ttl-seconds=300
management.health.redis.enabled=false

# Disable Kafka listener auto-startup in tests unless explicitly enabled
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092
adserve.kafka.topics.impressions=ad-impressions
adserve.kafka.topics.clicks=ad-clicks
adserve.kafka.consumer.group.impression=impression-analytics-group
adserve.kafka.consumer.group.click=click-analytics-group
