services:
  # ==============================================================================
  # 1. Spring Boot Backend Web Service
  # ==============================================================================
  - type: web
    name: adserve-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        value: adserve-mysql
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: adserve_db
      - key: DB_USERNAME
        value: adserve_user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: adserve-mysql
          envVarKey: MYSQL_PASSWORD
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: adserve-redis
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: adserve-kafka:9092
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://adserve-frontend.vercel.app,http://localhost:5173"

  # ==============================================================================
  # 2. Managed Redis (Key Value) Service
  # ==============================================================================
  - type: keyvalue
    name: adserve-redis
    plan: starter
    ipAllowList: []

  # ==============================================================================
  # 3. MySQL 8.0 Database (Render Private Service with Persistent Disk)
  # ==============================================================================
  - type: pserv
    name: adserve-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.0
    plan: starter
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: adserve_db
      - key: MYSQL_USER
        value: adserve_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  # ==============================================================================
  # 4. Apache Kafka 3.7 (Render Private Service with Persistent Disk, KRaft Mode)
  # ==============================================================================
  - type: pserv
    name: adserve-kafka
    runtime: image
    image:
      url: docker.io/apache/kafka:3.7.0
    plan: starter
    disk:
      name: kafka-data
      mountPath: /var/lib/kafka/data
      sizeGB: 10
    envVars:
      - key: KAFKA_NODE_ID
        value: "1"
      - key: KAFKA_PROCESS_ROLES
        value: "broker,controller"
      - key: KAFKA_LISTENERS
        value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      - key: KAFKA_ADVERTISED_LISTENERS
        value: "PLAINTEXT://adserve-kafka:9092"
      - key: KAFKA_CONTROLLER_LISTENER_NAMES
        value: "CONTROLLER"
      - key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      - key: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: "1@adserve-kafka:9093"
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
        value: "1"
      - key: KAFKA_LOG_DIRS
        value: "/var/lib/kafka/data"
      - key: CLUSTER_ID
        value: "4L622nShTUiGHLSki5EIbg"
